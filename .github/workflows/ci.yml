name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17]
    # The external session storage contract tests run against these services.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qoder
          POSTGRES_PASSWORD: qoder
          POSTGRES_DB: qoder_session_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qoder -d qoder_session_store"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QODER_SAMPLE_TEST_REDIS_URL: redis://127.0.0.1:6379
      QODER_SAMPLE_TEST_POSTGRES_URL: postgresql://qoder:qoder@127.0.0.1:5432/qoder_session_store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and test Java samples from Central
        run: mvn -B -ntp -Dmaven.repo.local="${{ runner.temp }}/java-maven-cache" clean verify
        working-directory: java

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - run: npx playwright install --with-deps chromium
        working-directory: typescript/web-ui-showcase
      - run: npm run check --workspaces
        working-directory: typescript

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: python
      - run: uv run ruff check .
        working-directory: python
      - run: uv run ruff format --check .
        working-directory: python
      - name: Type-check samples
        run: |
          for sample in quickstart multi-turn-conversation streaming-chat code-review tool-permissions ask-user-question model-selection hooks custom-tools subagents external-session-storage; do
            uv run mypy "$sample"
          done
        working-directory: python
